# NepStack: Android 12 + Android 16 emulators, built from this fork.
# Rules: no volumes, no bind mounts. Only host access is /dev/kvm. Host ports bound to localhost only.
# Screens are also reachable via Coolify domains (sslip.io), protected by VNC_PASSWORD (required; set it in Coolify).
# adb stays private: ssh -L 5555:localhost:5555 -L 5556:localhost:5556 <server>
services:
  android-12:
    build:
      context: .
      dockerfile: docker/emulator/Dockerfile
      args:
        EMULATOR_ANDROID_VERSION: "12.0"
        EMULATOR_API_LEVEL: "32"
    devices:
      - /dev/kvm
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      VNC_PASSWORD: "${VNC_PASSWORD:?}"
      EMULATOR_ADDITIONAL_ARGS: "-memory 4096 -cores 3"
    ports:
      - "127.0.0.1:5555:5555"
      - "127.0.0.1:6080:6080"
    mem_limit: 6g
    cpus: 3
    restart: unless-stopped

  android-16:
    build:
      context: .
      dockerfile: docker/emulator/Dockerfile
      args:
        EMULATOR_ANDROID_VERSION: "16.0"
        EMULATOR_API_LEVEL: "36"
    devices:
      - /dev/kvm
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      VNC_PASSWORD: "${VNC_PASSWORD:?}"
      EMULATOR_ADDITIONAL_ARGS: "-memory 4096 -cores 3"
    ports:
      - "127.0.0.1:5556:5555"
      - "127.0.0.1:6081:6080"
    mem_limit: 6g
    cpus: 3
    restart: unless-stopped
